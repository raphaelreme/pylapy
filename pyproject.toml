[build-system]
requires = ["uv_build>=0.13.3,<0.14"]
build-backend = "uv_build"

[project]
name = "pylapy"
version = "1.1.0"
description = "Pythonic wrapper around Linear Assignement Problem solvers"
readme = "README.md"
authors = [
    { name = "Raphael Reme", email = "raphaelreme-dev@protonmail.com" }
]
maintainers = [
    { name = "Raphael Reme", email = "raphaelreme-dev@protonmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["LAP", "Linear Programming", "Optimization", "Assignment Problem", "Jonker Volgenant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

requires-python = ">=3.10"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
lap = [
    "lapx",  # Let's use lapx instead of lap (maintained)
]
lapjv = [
    "lapjv",  # Does not work on MacOS? to be moved to lapx?
]
lapsovler = [
    "lapx",  # Let's use lapx instead of lapsolver (maintained)
]
scipy = [
    "scipy",  # Works everywhere
]
sparse = [
    "scipy",
    "numba",
]

[dependency-groups]
dev = [
    "matplotlib",
    "mypy",
    "numba",
    "opencv-python",
    "prek",
    "pytest",
    "pytest-cov",
    "ruff",
    "scipy-stubs",
    "tqdm",
    "types-tqdm",
]


[project.urls]
Homepage = "https://github.com/raphaelreme/pylapy"
Documentation = "https://github.com/raphaelreme/pylapy"
Repository = "https://github.com/raphaelreme/pylapy"
Issues = "https://github.com/raphaelreme/pylapy/issues"


[tool.uv]
python-preference = "only-managed"


[tool.ruff]
line-length = 120
indent-width = 4


# Format
format.docstring-code-format = true
format.indent-style = "space"
format.quote-style = "double"
format.line-ending = "lf"
format.skip-magic-trailing-comma = false

# Lint
lint.select = ["ALL"]

lint.ignore = [
    "ANN001",  # Checked by mypy which allows default args not to be typed
    "COM812",  # Recommended by ruff as we use the formatter
    "D100",  # Module docstring
    "D107",  # __init__ docstring
    "EM", "TRY003",  # Let's rely on standard exceptions
    "FBT",  # Ignore boolean trap
    "FIX", "TD",  # Ignore TODO, FIXME, XXX
    "CPY001",  # Copyright
]


lint.future-annotations = true
lint.flake8-annotations.ignore-fully-untyped = true
lint.flake8-annotations.mypy-init-return = true
lint.pep8-naming.ignore-names = [
    "i",
    "j",
    "k",
    "n",
    "t",
    "X*",
    "Y*",
    "A",
    "B",
]
lint.pydocstyle.convention = "google"
lint.pylint.max-args = 8

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["INP001", "D103", "S101", "ANN201", "SLF001", "T201"]
"benchmark/*.py" = ["INP001", "D103", "S101", "ANN201", "SLF001", "T201", "NPY002", "ERA001"]


[tool.mypy]
enable_error_code = ["ignore-without-code"]
check_untyped_defs = true

[tool.pytest.ini_options]
strict = true

[tool.coverage.run]
source = ["pylapy"]
